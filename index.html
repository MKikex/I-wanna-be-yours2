<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNDER SEVEN KEYS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300&display=swap');
*{box-sizing:border-box}body{margin:0;overflow:hidden;min-height:100vh;background:radial-gradient(ellipse at 50% 55%,#252128,#111118 45%,#07080d);color:#dbc9aa;font-family:'Cormorant Garamond',serif}
#scene{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}.stars,.dust{position:absolute;inset:0;overflow:hidden;pointer-events:none}.star{position:absolute;width:2px;height:2px;background:#c9b58d;border-radius:50%;animation:twinkle 4s infinite}@keyframes twinkle{50%{opacity:.9;transform:scale(1.7)}}.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:#c8a66b;opacity:0;animation:float 10s linear infinite}@keyframes float{0%{transform:translateY(20vh);opacity:0}20%{opacity:.4}100%{transform:translateY(-110vh) translateX(45px);opacity:0}}
.heading{position:absolute;top:9%;text-align:center;width:100%;padding:0 12px}.heading h1{font-size:clamp(28px,4vw,43px);letter-spacing:5px;font-weight:400;margin:0;color:#d8c4a5}.heading p{font-family:Montserrat,sans-serif;font-size:10px;letter-spacing:4px;color:#92816b;margin-top:15px}
.stage{width:350px;height:330px;display:flex;align-items:center;justify-content:center;perspective:900px;position:relative;margin-top:30px}.glow{position:absolute;width:280px;height:180px;background:#c08d43;filter:blur(85px);opacity:0;transition:opacity 2s;bottom:20px}
#chest{position:relative;width:260px;height:190px;transition:transform .7s}.base{position:absolute;bottom:0;width:260px;height:142px;border:2px solid #624627;border-radius:7px 7px 13px 13px;background:linear-gradient(90deg,#26180f,#50331c 18%,#2f1e13 48%,#51351e 78%,#24170f);box-shadow:0 28px 45px #0009,inset 0 5px 12px #8b633333;overflow:hidden}.base:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24px,#100b07 25px 27px,transparent 28px 53px);opacity:.6}.base:after{content:'';position:absolute;left:18px;right:18px;top:12px;bottom:12px;border:1px solid #a77a42;border-radius:3px;opacity:.5}.band{position:absolute;z-index:3;top:0;bottom:0;width:20px;left:35px;background:linear-gradient(90deg,#5d421e,#b28a4b,#6b4b26);border:1px solid #bd9454}.band.right{left:auto;right:35px}.lid{position:absolute;left:0;top:28px;width:260px;height:106px;border:2px solid #704e2c;border-radius:15px 15px 4px 4px;background:linear-gradient(90deg,#28190f,#56381e 22%,#352214 55%,#51331c 80%,#28190f);transform-origin:bottom center;transition:transform 1.5s cubic-bezier(.2,.7,.2,1);box-shadow:inset 0 4px 10px #a57a4333;z-index:4}.lid:before{content:'';position:absolute;inset:10px 15px;border:1px solid #a77a42;border-radius:12px 12px 2px 2px;opacity:.5}.lid:after{content:'';position:absolute;left:35px;right:35px;top:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 23px,#130c07 24px 26px,transparent 27px 48px);opacity:.35}.lock{position:absolute;z-index:5;left:50%;top:70px;transform:translateX(-50%);width:46px;height:56px;border:2px solid #c19a5c;border-radius:7px;background:linear-gradient(135deg,#9b713c,#50371e);transition:.6s}.lock:before{content:'';position:absolute;left:10px;top:-22px;width:22px;height:25px;border:4px solid #b78b4d;border-bottom:0;border-radius:15px 15px 0 0}.lock:after{content:'';position:absolute;width:6px;height:12px;border-radius:6px;background:#2a1a0d;left:18px;top:21px}#chest.open .lid{transform:rotateX(-115deg)}#chest.open .lock{opacity:0;transform:translateX(-50%) translateY(30px)}#chest.open .glow{opacity:.65}#chest.open{transform:translateY(15px)}
.hint{position:absolute;bottom:13%;text-align:center;font-size:20px;color:#c2a77d;transition:opacity .5s}.hint small{display:block;font:10px Montserrat,sans-serif;letter-spacing:3px;margin-top:10px;color:#897a68}#message{position:absolute;bottom:5%;text-align:center;font-size:20px;color:#d8c4a1;opacity:0;transition:opacity 1.4s;max-width:90%}#message.visible{opacity:1}
.key-area{position:absolute;bottom:4%;right:8%;width:140px;height:140px;display:flex;align-items:center;justify-content:center;z-index:8}.key{width:105px;height:105px;cursor:grab;touch-action:none;filter:drop-shadow(0 8px 12px #0008);position:relative}.key:active{cursor:grabbing;filter:drop-shadow(0 0 18px #d9b77a)}.key svg{width:100%;height:100%;overflow:visible}.key.dragging{position:fixed;z-index:30;transform:scale(1.08);pointer-events:none}
#transition{position:fixed;inset:0;background:#e8c78e;opacity:0;pointer-events:none;z-index:40;transition:opacity 2s}#transition.active{opacity:1}
@media(max-width:600px){.heading{top:8%}.stage{transform:scale(.86);margin-top:20px}.key-area{bottom:5%;right:3%;width:110px;height:110px}.hint{bottom:17%}}
</style></head><body><div id="scene"><div class="stars" id="stars"></div><div class="dust" id="dust"></div><header class="heading"><h1>UNDER SEVEN KEYS</h1><p>Some things are worth unlocking</p></header>
<div class="stage"><div class="glow"></div><div id="chest"><div class="lid"></div><div class="base"><div class="band"></div><div class="band right"></div></div><div class="lock"></div></div></div>
<div class="hint" id="hint">Encuentra la llave<small>ARRÁSTRALA HASTA LA CERRADURA</small></div><div id="message">Hay cosas que merecen ser descubiertas.</div><div class="key-area" id="keyArea"><div class="key" id="key" tabindex="0" role="button" aria-label="Arrastra la llave hasta la cerradura"><svg viewBox="0 0 120 120"><defs><linearGradient id="g"><stop stop-color="#f1d69a"/><stop offset=".45" stop-color="#a87937"/><stop offset="1" stop-color="#e6c27f"/></linearGradient></defs><g fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="35" r="23"/><circle cx="34" cy="35" r="11" stroke-width="5"/><path d="M51 52 L98 99 M78 79 L89 68 M91 92 L103 80"/></g></svg></div></div></div><div id="transition"></div>
<script>
const stars=document.getElementById('stars'),dust=document.getElementById('dust'),key=document.getElementById('key'),keyArea=document.getElementById('keyArea'),chest=document.getElementById('chest'),hint=document.getElementById('hint'),message=document.getElementById('message'),transition=document.getElementById('transition');
for(let i=0;i<95;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';s.style.opacity=Math.random()*.5;stars.appendChild(s)}for(let i=0;i<28;i++){let d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.bottom=(-Math.random()*30)+'%';d.style.animationDelay=Math.random()*9+'s';d.style.animationDuration=(7+Math.random()*9)+'s';dust.appendChild(d)}
let dragging=false,offX=0,offY=0,opened=false;function start(e){if(opened)return;e.preventDefault();dragging=true;let r=key.getBoundingClientRect();offX=e.clientX-r.left;offY=e.clientY-r.top;key.classList.add('dragging');key.style.left=e.clientX-offX+'px';key.style.top=e.clientY-offY+'px';keyArea.style.display='none';document.body.appendChild(key)}function move(e){if(!dragging)return;key.style.left=e.clientX-offX+'px';key.style.top=e.clientY-offY+'px'}function end(e){if(!dragging)return;dragging=false;key.classList.remove('dragging');let l=document.querySelector('.lock').getBoundingClientRect(),lx=l.left+l.width/2,ly=l.top+l.height/2;let dist=Math.hypot(e.clientX-lx,e.clientY-ly);if(dist<190){unlock()}else{key.style.position='';key.style.left='';key.style.top='';key.style.margin='';keyArea.style.display='';keyArea.appendChild(key)}}key.addEventListener('pointerdown',start);window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);key.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();unlock()}});
function unlock(){if(opened)return;opened=true;key.style.display='none';hint.style.opacity=0;chest.classList.add('open');setTimeout(()=>message.classList.add('visible'),1700);setTimeout(()=>transition.classList.add('active'),4300);setTimeout(()=>location.href='midnight.html',6200)}
</script></body></html>
